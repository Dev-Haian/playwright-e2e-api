name: Testes Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 11 * * 1-5' # dias úteis, 8h (horário de Brasília)
  workflow_dispatch:
    inputs:
      viewport:
        description: 'Resoluções (fullhd, notebook, tablet, mobile ou all)'
        default: 'all'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Health check + E2E + API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_VIEWPORT: ${{ github.event.inputs.viewport || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos (TypeScript)
        run: npm run typecheck

      # Guarda o último estado de cada serviço para detectar "caiu" e "voltou"
      - name: Restaurar estado do health check
        uses: actions/cache/restore@v4
        with:
          path: health-results/state.json
          key: health-state-${{ github.run_id }}
          restore-keys: health-state-

      - name: Health check dos serviços
        run: npm run health
        env:
          HEALTH_WEBHOOK_URL: ${{ secrets.HEALTH_WEBHOOK_URL }}

      - name: Salvar estado do health check
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: health-results/state.json
          key: health-state-${{ github.run_id }}

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Rodar testes
        run: npx playwright test

      - name: Juntar relatórios
        if: ${{ !cancelled() }}
        run: |
          mkdir -p playwright-report/health
          cp health-results/index.html health-results/health.json playwright-report/health/ || true

      - name: Guardar relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy-report:
    name: Publicar relatório
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
